name: Check interactive lessons

on:
  push:
    paths: ['interactive/**', 'tools/**', 'docs/study-checklist.md', 'docs/*-reading-guide.md']
  pull_request:
    paths: ['interactive/**', 'tools/**', 'docs/study-checklist.md', 'docs/*-reading-guide.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-interactive.mjs
      - run: node tools/build-search-index.mjs --check
      - run: node tools/build-mock-bank.mjs --check
      - run: node tools/build-precache.mjs --check
      - run: node tools/verify-checklist.mjs
      - run: node tools/check-guides.mjs
      - run: node tools/test-registry.mjs
