<html lang="en">
<head>

<title>C++ in Motion #7</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --line: #d0d7de;
    --text: #1f2328; --muted: #656d76;
    --stack: #0d9488; --stack-bg: #d9f5f1;
    --heap: #ea580c; --heap-bg: #ffedd5;
    --warn: #dc2626; --accent: #b45309;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e5e7eb; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; }
  .slide { display: none; position: absolute; inset: 0; background: var(--bg); }
  .slide.on { display: block; }
  .slide svg { width: 1080px; height: 1350px; display: block; }
  svg text { fill: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }
  .tag { font-size: 28px; letter-spacing: 3px; fill: var(--muted); }
  .kw { fill: #0550ae; } .ty { fill: #116329; } .nm { fill: #953800; } .cm { fill: var(--muted); }

  .f   { opacity: 0; animation: fi .6s ease both; animation-delay: var(--d, 0s); }
  .p   { opacity: 0; transform-box: fill-box; transform-origin: center;
         animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; animation-delay: var(--d, 0s); }
  .d   { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dr .7s ease both; animation-delay: var(--d, 0s); }
  .out { animation: fo .5s ease forwards; animation-delay: var(--d, 0s); }
  .dim { animation: dim .6s ease forwards; animation-delay: var(--d, 0s); }
  .mv  { animation: mv .9s ease both; animation-delay: var(--d, 0s); }
  @keyframes fi  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fo  { from { opacity: 1; } to { opacity: 0; } }
  @keyframes dim { from { opacity: 1; } to { opacity: .22; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes dr  { to { stroke-dashoffset: 0; } }
  @keyframes mv  { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 1; transform: translate(-470px, 215px); } }

  #dots { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; z-index: 9; }
  #dots i { display: inline-block; width: 10px; height: 10px; margin: 0 5px; border-radius: 50%; background: #d0d7de; }
  #dots i.on { background: var(--accent); }
  .export #dots { display: none; }
  @page { size: 1080px 1350px; margin: 0; }
  .print html, .print body { overflow: visible; height: auto; background: var(--bg); }
  .print #stage { position: static; transform: none !important; height: auto; }
  .print .slide { display: block; position: relative; width: 1080px; height: 1350px; page-break-after: always; break-after: page; overflow: hidden; }
</style>
</head>

  <g class="p" style="--d:1.9s">

  </g>

  <text class="f" style="--d:4.7s;fill:#b45309" x="70" y="1215" font-size="48" font-weight="700">What do you do?</text>
  <text class="f" style="--d:5s;fill:#656d76" x="70" y="1300" font-size="30">C++ in Motion · #7</text>
</svg>
</section>

</div>
<div id="dots"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var dots = document.getElementById('dots');
  var SLIDE_MS = 6000;

  function fit() {
    if (q.has('print') || q.get('scale') === '1') { stage.style.transform = 'none'; return; }
    var s = Math.min(innerWidth / 1080, innerHeight / 1350);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.max(0, (innerWidth - 1080 * s) / 2) + 'px';
  }
  addEventListener('resize', fit); fit();

  function freeze(ms) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; });
  }

  if (q.has('flip')) {                       // swipe-to-animate carousel: one page per animation step
    var steps = [[1, 5000], [2, 20000], [3, 3200], [3, 20000], [4, 20000], [5, 20000]];
    document.documentElement.classList.add('print', 'export');
    var made = steps.map(function (st, i) {
      var c = slides[st[0] - 1].cloneNode(true);
      c.classList.add('on');
      c.querySelectorAll('.tag')[1].textContent = (i + 1) + ' / ' + steps.length;
      if (i === 0) {
        var hint = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        hint.setAttribute('x', 1010); hint.setAttribute('y', 1290);
        hint.setAttribute('text-anchor', 'end'); hint.setAttribute('font-size', 36);
        hint.style.fill = '#b45309'; hint.textContent = 'swipe →';
        c.querySelector('svg').appendChild(hint);
      }
      stage.appendChild(c);
      return [c, st[1]];
    });
    slides.forEach(function (s) { s.remove(); });
    requestAnimationFrame(function () {
      made.forEach(function (m) {
        m[0].getAnimations({ subtree: true }).forEach(function (a) { a.pause(); a.currentTime = m[1]; });
      });
    });
    return;
  }
  if (q.has('print')) {
    document.documentElement.classList.add('print', 'export');
    slides.forEach(function (s) { s.classList.add('on'); });
    requestAnimationFrame(function () { freeze(20000); });
    return;
  }
  if (q.has('slide')) {                      // export a single frame: ?slide=N&t=ms
    document.documentElement.classList.add('export');
    slides[+q.get('slide') - 1].classList.add('on');
    requestAnimationFrame(function () { freeze(+(q.get('t') || 20000)); });
    return;
  }

  // preview: autoplay, arrows / click to move
  slides.forEach(function () { dots.appendChild(document.createElement('i')); });
  var cur = -1, timer;
  function show(i) {
    cur = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle('on', k === cur); });
    [].forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === cur); });
    clearTimeout(timer);
    timer = setTimeout(function () { show(cur + 1); }, SLIDE_MS);
  }
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'r') show(cur);
  });
  document.body.addEventListener('click', function () { show(cur + 1); });
  show(0);
})();
</script>
</body>
</html>
